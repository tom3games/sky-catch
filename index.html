<body>
<div id="view"></div>

<!-- タイトル: 工事現場の「頭上注意」の看板 -->
<section id="title" class="screen">
  <div class="sign">
    <div class="sign-in">
      <p class="sign-top" data-t="signTop"></p>
      <h1 class="logo" data-t="logo"></h1>
      <p class="sign-sub" data-t="signSub"></p>
    </div>
  </div>
  <p class="radio"><b data-t="radioName"></b><span data-t="radioLine"></span></p>
  <div class="title-actions">
    <!-- ルール: 通常（90秒）／エンドレス（1人でも落としたら終わり）。工事の切替札の見た目 -->
    <div class="mode" role="group"><button class="mode-btn" data-mode="normal" data-t="modeNormal"></button><button class="mode-btn" data-mode="endless" data-t="modeEndless"></button></div>
    <p id="modeHint" class="mode-hint hidden" data-t="modeHint"></p>
    <button id="btnStart" class="go" data-t="start"></button>
    <button id="btnHow" class="tlink strong" data-t="how"></button>
  </div>
  <nav class="foot">
    <button id="btnLang" class="chip" data-t="lang"></button>
    <button id="btnMute" class="chip"></button>
    <a class="chip" href="https://tom3games.github.io/" data-t="more"></a>
  </nav>
</section>

<!-- 遊び方: 隊員手帳のページ -->
<section id="how" class="screen hidden">
  <div class="notebook">
    <h2 data-t="howTitle"></h2>
    <ol id="howList"></ol>
    <p class="keys" id="howKeys"></p>
    <button class="go small" data-close data-t="ok"></button>
    <p class="credit" data-t="credit"></p>
  </div>
</section>

<!-- 遊び中 -->
<canvas id="speedfx"></canvas><div id="hitflash"></div>
<section id="hud" class="hidden">
  <div id="counter" class="counter" aria-label="救助した人数">
    <div class="c-win"><span id="cNum">000</span></div>
    <div class="c-lab"><span data-t="saved"></span><span id="cCarry"></span></div>
  </div>
  <div id="chain" class="chain hidden"></div>
  <div id="watch" class="watch" aria-label="残り時間">
    <svg viewBox="0 0 64 64"><rect x="28" y="1" width="8" height="6" rx="1.5" class="w-crown"/><circle cx="32" cy="35" r="25" class="w-face"/><path id="wArc" class="w-arc" d=""/></svg>
    <b id="wNum">90</b>
  </div>
  <div id="bubbles"></div>
  <div id="say" class="say hidden"></div>
  <div id="arrow" class="edge-arrow hidden"><svg viewBox="0 0 24 24"><path d="M12 2 L21 20 L12 15 L3 20Z"/></svg><span id="arrowD"></span></div>
  <div id="heightBox" class="height-box hidden" data-dir="same"><svg class="chev" viewBox="0 0 16 12" aria-hidden="true"><path d="M2 10 L8 3 L14 10"/></svg><span id="hDiff"></span><span id="hSec" class="h-sec"></span><span id="hLook" class="h-look"></span></div>
  <div id="miss" class="miss hidden"><span>×</span><small data-t="tooFar"></small></div>
  <button id="btnPause" class="corner-btn" data-t="pause"></button>
  <div id="touch" class="touch hidden">
    <div id="stickZone" class="stickzone"><div id="stick" class="stick"><div class="knob"></div></div></div>
    <button class="tbtn troll hidden" data-k="roll" aria-label="roll"><svg viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-5-10.7" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M27 9h8v8" fill="none" stroke="currentColor" stroke-width="3.5"/></svg><span data-t="roll"></span></button>
    <button class="tbtn tbig" data-k="wire" aria-label="wire"><svg viewBox="0 0 48 48"><path d="M10 40 36 10" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"/><path d="M26 9h11v11" fill="none" stroke="currentColor" stroke-width="3.5"/></svg></button>
  </div>
</section>

<!-- 一時停止 -->
<section id="pause" class="screen hidden">
  <div class="notebook narrow">
    <h2 data-t="paused"></h2>
    <button id="btnResume" class="go small" data-t="resume"></button>
    <button id="btnQuit" class="tlink dark" data-t="quit"></button>
  </div>
</section>

<!-- 結果: 感謝状 -->
<section id="result" class="screen hidden">
  <div class="cert-wrap"><canvas id="cert"></canvas></div>
  <div class="result-actions">
    <button id="btnAgain" class="go small" data-t="again"></button>
    <div class="chips">
      <button id="btnSave" class="chip" data-t="save"></button>
      <a id="btnPost" class="chip" target="_blank" rel="noopener" data-t="post"></a>
      <button id="btnTitle" class="chip" data-t="toTitle"></button>
    </div>
  </div>
</section>

<!-- ロード画面: 頭上注意の看板が揺れる（2026-11-03 本人「開いた最初に、いい感じのロード中の画面を。そのゲームの雰囲気に合ったやつ」） -->
<div id="boot" class="boot">
  <div class="boot-sign" aria-hidden="true">
    <svg viewBox="0 0 120 150"><path d="M22 4 H98" stroke="#c9ced3" stroke-width="5" stroke-linecap="round"/><g class="swing"><path d="M60 4 L36 54 M60 4 L84 54" stroke="#c9ced3" stroke-width="2.5"/><path d="M60 30 L110 80 L60 130 L10 80Z" fill="#f2c230" stroke="#16140f" stroke-width="5" stroke-linejoin="round"/><path d="M60 52 L60 92" stroke="#16140f" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="108" r="6" fill="#16140f"/></g></svg>
  </div>
  <p class="boot-msg" data-t="loading">救護マットをふくらませ中</p>
  <div class="boot-bar"><i id="bootBar"></i></div><span id="bootPct" class="boot-pct">0%</span>
</div>
<script>
// ロード画面の進み具合（three の読み込み数を game.js が __bootSet で渡す。それまでは少しずつ進める）
(function(){
  var bar=document.getElementById('bootBar'),pct=document.getElementById('bootPct'),k=0,real=false;
  function draw(){bar.style.transform='scaleX('+k.toFixed(3)+')';pct.textContent=Math.round(k*100)+'%'}
  window.__bootSet=function(v){real=true;if(v>k){k=Math.min(1,v);draw()}};
  var t=setInterval(function(){if(real||window.__bootDone){clearInterval(t);return}k=Math.min(0.18,k+0.006);draw()},250);   // 本体の読み込み中（three 本体の取得）
  draw();
})();
</script>

<script>
// 拡大を止める（ピンチ・ダブルタップ・Ctrl+ホイール）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険: エラー（読み込めなかったファイルも）があって 9 秒たっても準備できていない、または 60 秒たっても準備できていない時に原因を出す
(function(){
  var errs=[];
  window.addEventListener('error',function(e){var tg=e.target;if(tg&&tg!==window&&(tg.src||tg.href))errs.push('load failed: '+(tg.src||tg.href));else errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))},true);
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  function show(){
    if(window.__catchReady||document.getElementById('boot-err')) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  }
  setTimeout(function(){if(errs.length)show()},9000);
  setTimeout(show,60000);
})();
</script>
<script src="sfx.js?v=13"></script>

</body>
